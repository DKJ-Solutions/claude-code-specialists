# CI gate: runs the lint gate + all test suites on every PR and every push to main.
# This is the same guard that open-pr.ps1 runs locally, but inescapable -- even a PR that
# originates outside the scripts (GitHub UI, or a forgotten -SkipLint) passes through here.
# The scripts target Windows PowerShell 5.1, so we run on windows-latest with
# `shell: powershell` (5.1), not pwsh.
name: CI

# Least-privilege (Sean's advice): this workflow only reads -- the GITHUB_TOKEN gets no write access.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

# TWO GROUPING RULES IN ONE KEY: a PR is keyed on its REF, a push to `main` on its own COMMIT.
#
# THE PR HALF IS THE CHEAP HALF and is unchanged. A PR run that a later push supersedes is measuring a
# commit nobody will merge, so killing it is free: `synchronize` fires on every push, which is how PR
# #933 came to carry three consecutive full runs of one branch at ~7m40s each, on a runner whose
# minutes bill double. So PR runs share a group per `github.ref` and cancel each other.
#
# THE PUSH HALF IS KEYED PER COMMIT, AND `cancel-in-progress` IS NOT WHAT PROTECTS IT -- issue #1294.
# Every push to `main` used to share one `refs/heads/main` group, with the conditional below relied on
# to stop the fold commit cancelling the merge commit's run. That could not work: a concurrency group
# holds at most one IN-PROGRESS run plus one PENDING one, and a third arrival DROPS the pending one
# without consulting `cancel-in-progress` at all. ship-pr pushes to `main` twice per branch -- the
# merge commit, then the fold commit that clears the branch document, measured 6s apart on #932 -- so
# on a ~15-minute run the merge commit's run was still queued when the fold displaced it.
#
# MEASURED September 3, 2026 over the 28 most recent `merge:` commits on the trunk's first-parent line:
# 14 `success`, 14 `cancelled`. Half the trunk had never been gated. Run 33742497546 (merge commit
# 371af75b, #1268) was created 10:06:15Z and cancelled 10:06:23Z having allocated ZERO jobs, which is
# the proof it never left the queue rather than being killed mid-run. And it was never only folds
# displacing merges: 0ab47d2d, 2c54de74 and e0175372 went down in one chain, so on a busy trunk only
# the LAST push of each ~15-minute window ran at all. The tip was always gated; nothing between it and
# the previous tip ever was, which is why that day's two `failure` runs named no commit.
#
# THE EXTRA RUNNER MINUTES ARE THE POINT, NOT AN OVERSIGHT: every push to `main` now runs, where before
# roughly half were dropped -- 27 runs instead of 13 on September 3. The PR saving above is untouched,
# because the push half never shared a group with a PR in the first place (`github.ref` is
# refs/pull/N/merge there and refs/heads/main here), so none of what #932 measured is reopened. Whether
# the FOLD commit needs a full run of its own is a separate question with its own trade-off, and it is
# deliberately not answered here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-en-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint gate (check-plugin-integrity)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-plugin-integrity.ps1
          exit $LASTEXITCODE

      # THE SAME SHARED GATE open-pr.ps1 AND cut-release.ps1 RUN, not a third copy of its loop. This step
      # held an inline copy until August 7, 2026 (issue #512), which is how it would have kept running the
      # suites one at a time for days after both local callers were parallelised -- the copy nobody looks
      # at being the one that drifts.
      #
      # -MaxParallel IS PASSED EXPLICITLY, because the default is wrong here for a good reason. The gate
      # holds two cores back so a developer's machine stays usable while it runs; a GitHub runner has
      # nobody sitting at it and only four cores, so that reservation would cost half the box. The
      # knowledge of which kind of machine this is lives here, not in the lib.
      # repo-config.ps1 IS DOT-SOURCED HERE TOO (inbound #644): the gate reads the optional
      # Get-TestCommands from it, and open-pr and cut-release have it in scope from their own
      # dot-source. Leaving it out here would make CI -- the one caller that actually blocks the
      # merge -- the one gate that cannot see a repo's extra test commands, silently. Guarded,
      # because this workflow may be copied into a repo that has no repo-config yet.
      - name: Test suites (scripts/tests/*.tests.ps1)
        shell: powershell
        run: |
          . ./scripts/lib/native-capture-lib.ps1
          if (Test-Path ./scripts/repo-config.ps1) { . ./scripts/repo-config.ps1 }
          $gateOk = Invoke-TestSuiteGate -TestsDir ./scripts/tests -Context 'CI' -MaxParallel ([Environment]::ProcessorCount)
          if (-not $gateOk) { exit 1 }
          exit 0
