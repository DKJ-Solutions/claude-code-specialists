# The fold-on-merge gate: folds a queue-merged PR's changelog entry, since the session that ships it
# never sees the merge (issue #1493).
#
# WHAT THIS CLOSES. fold-changelog-entry.ps1 has always run from exactly one place -- ship-pr.ps1,
# as the shipping session's own next step after its own merge call returns. The merge queue (#1492)
# merges a PR itself, in a process that session never observes, so that step never runs: the branch's
# dkj-policy/<branch>.md sits on the trunk, unfolded, until check-unfolded-entry.ps1 notices it after
# the fact (a SessionStart hook, or the advisory unfolded-entry.yml push check), with nobody to fold
# it but a human doing it by hand. This workflow is the fold running from the one place that always
# sees a queue merge: a push to main.
#
# IT ADDS NO RULE OF ITS OWN, AND NO SECOND DETECTOR. It runs check-unfolded-entry.ps1 -Branch main
# unchanged -- the exact function (Get-UnfoldedTrunkEntry) unfolded-entry.yml already reports with --
# and only when THAT finds a leftover does it call fold-changelog-entry.ps1 -Commit -Push.
#
# FOLD-ALL MODE, DELIBERATELY, RATHER THAN A BRANCH DERIVED FROM THE PUSH EVENT.
# fold-changelog-entry.ps1 already discovers every unfolded per-branch document with no branch named
# -- the same declared-branch read check-unfolded-entry.ps1 uses -- and resolves each one's own PR via
# its own `gh pr list` lookup keyed on that declared branch. The associated-PR API
# (GET /repos/{owner}/{repo}/commits/{sha}/pulls) or a parse of the merge-commit message would answer
# a question this already answers from the tree itself, for one branch per run instead of the whole
# backlog a push might be carrying.
#
# contents: read + pull-requests: read, AND NOTHING ELSE, for the default GITHUB_TOKEN. pull-requests:
# read is not optional: the fold step's own `gh pr list` needs it, and declaring any permissions block
# at all sets every unlisted scope to none. contents: write is deliberately NOT granted here -- the
# actual push authenticates as FOLD_PUSH_TOKEN (see below), which the checkout step wires in directly
# and which never touches this permissions block at all.
#
# PUSHES AS AN ORG ADMIN, NOT AS THE GITHUB ACTIONS APP (issue #1493). TWO of main-ci-gate's rules
# block any push to main unless the pushing actor is a listed bypass actor -- required_status_checks
# AND merge_queue, and naming only the first is what made a diagnosis unreadable once already (issue
# #1499, below). The default GITHUB_TOKEN pushes as the GitHub Actions app (integration_id 15368),
# which is not on that bypass list -- and cannot be added to it: that app is owned by `anthropics`,
# installed on this org but not administered by it, so there is no private key for it to authenticate
# as. The bypass list already carries `OrganizationAdmin` with `bypass_mode: always`, so this job
# checks out with a fine-grained personal access token (secrets.FOLD_PUSH_TOKEN) belonging to an org
# owner instead -- that identity already bypasses the ruleset today, with no ruleset change needed.
# The token is scoped to this repository only and to `Contents: Read and write` only, and it expires
# within the org's enforced 366-day maximum, so it needs rotating before then or this job starts
# failing its push again with no code-level cause. THIS IS A STANDING CREDENTIAL, NOT A FIX-FOR-FIX
# SWAP: the default GITHUB_TOKEN it replaces is job-scoped and expires in about an hour, unusable
# outside this one run; FOLD_PUSH_TOKEN is usable from anywhere for up to a year, and because
# actions/checkout's default `persist-credentials: true` writes it into the workspace's git config,
# every step of this job holds it, not only the push step. Sebastian's review of #1493's PR flagged
# this asymmetry as worth stating rather than leaving implicit in the rotation note alone.
#
# WHAT THAT REJECTION ACTUALLY LOOKS LIKE, because a red run here has two entirely different causes and
# only the log tells them apart (issue #1499). Measured verbatim in run 34020828593, the push carrying
# the #1498 merge, 2026-09-06 08:04 -- a run in which the fold itself SUCCEEDED:
#
#   Folded and removed: dkj-policy/fix-1497-fold-all-reserved-names.md (tier 2, significance 4 -- ...)
#   CHANGELOG.md updated.
#   Committed: fold: fix/1497-fold-all-reserved-names changelog (#1498)
#   remote: error: GH013: Repository rule violations found for refs/heads/main.
#   remote: - Required status check "lint-en-tests" is expected.
#   remote: - Changes must be made through the merge queue
#
# THE FOLD STEP GOING RED IS THEREFORE NOT EVIDENCE THAT THE FOLD REFUSED. #1499 was filed on three red
# runs of this job read as one symptom: the first two (2026-09-05 23:56 and 2026-09-06 07:32) really were
# fold refusals -- the #1497 misread of dkj-policy/CHANGELOG.md, repaired by #1498 -- and the third was
# this ruleset rejection with a clean fold above it. That third run was the report's own proof that
# #1498's fix had not taken, and it proved the opposite. Read the fold script's own last lines before
# concluding anything about the fold: it says which of the two happened, in so many words.
#
# NO CONCURRENCY CANCELLATION, unlike unfolded-entry.yml's read-only report. That workflow can safely
# let a later push's run supersede an earlier one, because both would report the same fact a moment
# apart. This one WRITES: cancelling a fold in progress is exactly the silent skip #1493 exists to
# close, so every push gets its own run and none is dropped. The resulting race (two runs folding
# close together) is already handled by fold-changelog-entry.ps1's own push-failure diagnosis, which
# tells the two apart rather than corrupting anything.
#
# WINDOWS, like every other workflow that runs these scripts: they target Windows PowerShell 5.1, so
# this runs under `shell: powershell` (5.1) rather than pwsh.
name: Fold on merge

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]

concurrency:
  group: fold-on-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fold-on-merge:
    runs-on: windows-latest
    steps:
      # token here, not the default GITHUB_TOKEN: this is what makes the fold step's later `git push`
      # authenticate as the org-owner identity behind FOLD_PUSH_TOKEN rather than as the GitHub Actions
      # app -- see the header comment above for why the app itself cannot be a ruleset bypass actor.
      # Pinned to a commit SHA, matching claude.yml and claude-code-review.yml's own convention for a
      # checkout step that handles a real credential -- a mutable tag on this line could otherwise
      # retag its way into exfiltrating a 366-day standing write token instead of an hour-lived one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.FOLD_PUSH_TOKEN }}

      # continue-on-error is deliberate: check-unfolded-entry.ps1 exits non-zero on a genuine
      # find, which is the case this job exists to act on, not a step failure. BUT that leaves
      # a real crash in the detector (a git call misbehaving, an unhandled exception) exiting
      # non-zero too, indistinguishable from "found" at the process boundary -- and the fold
      # step below refuses to treat those the same, rather than folding blind on an outcome it
      # cannot explain (Victor #19, pre-merge review of this branch).
      - name: Is there an unfolded changelog entry on the trunk?
        id: check
        shell: powershell
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-unfolded-entry.ps1 -Branch main *>&1 | Tee-Object -FilePath check-output.txt
          exit $LASTEXITCODE

      - name: Fold it (fold-all mode -- every leftover this push may carry)
        if: ${{ steps.check.outcome == 'failure' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The check step's own known-good signature (its [ERROR] line, verified against the
          # live script) is what tells "a leftover was found" apart from "the script crashed for
          # some other reason" -- both exit non-zero, and only one of them is safe to act on.
          $checkOutput = Get-Content check-output.txt -Raw
          if ($checkOutput -notmatch '\[ERROR\] the trunk carries') {
            Write-Error "check-unfolded-entry.ps1 exited non-zero for a reason other than a reported leftover -- refusing to fold blind. Its output:`n$checkOutput"
            exit 1
          }

          # This is commit-metadata identity only -- who authored the commit -- and is independent of
          # the push's actual credential (FOLD_PUSH_TOKEN, wired in by the checkout step above). A
          # ruleset bypass is checked against the pushing token's identity, not the commit author.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/fold-changelog-entry.ps1 -Commit -Push *>&1 | Tee-Object -FilePath fold-output.txt
          $foldExitCode = $LASTEXITCODE

          # The two scripts read the same trunk a moment apart and must agree: the check found a
          # leftover, so fold-all mode reporting nothing to fold is a real disagreement between
          # them, not a race worth swallowing -- fail loudly rather than report the job green on
          # a fold that fixed nothing.
          $foldOutput = Get-Content fold-output.txt -Raw
          if ($foldOutput -match 'No entry files found to fold') {
            Write-Error "check-unfolded-entry.ps1 reported a leftover but fold-changelog-entry.ps1 found nothing to fold -- the two disagree, which should not happen. Its output:`n$foldOutput"
            exit 1
          }
          exit $foldExitCode
