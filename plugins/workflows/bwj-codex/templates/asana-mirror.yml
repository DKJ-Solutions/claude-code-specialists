# Copied from bwj-codex/templates/asana-mirror.yml into .github/workflows/asana-mirror.yml.
# Posts an update on the mirrored Asana task when its GitHub issue is closed (and the counterpart on
# reopen), and moves that task to the board section its issue's state has reached. Plus a daily
# reconciliation sweep (both directions) for missed events -- and for the three stages that have no
# GitHub event at all, that sweep IS the mechanism rather than a backstop. It never completes a task
# and never puts a card in the 'Completed' section -- the colleague who filed the ticket does both,
# after testing. See bwj-codex/WORKFLOW-portable.md.
name: asana-mirror

on:
  issues:
    types: [closed, reopened]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # WRITE, not read, since the prio-label sweep edits labels on this repo's own issues. It is the
  # only write this workflow makes outside Asana, and it touches labels and nothing else.
  issues: write
  # The close update names the pull request that closed the issue, which is a pull-requests read.
  pull-requests: read

concurrency:
  group: asana-mirror-${{ github.event.issue.number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update the task on issue close / reopen
        if: github.event_name == 'issues'
        shell: pwsh
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_PROJECT_GID: ${{ vars.ASANA_PROJECT_GID }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_REF: ${{ github.repository }}#${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/asana-mirror.ps1 `
            -Mode event `
            -Event $env:EVENT_ACTION `
            -IssueBody $env:ISSUE_BODY `
            -IssueRef $env:ISSUE_REF

      - name: Reconciliation sweep
        if: github.event_name != 'issues'
        shell: pwsh
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_PROJECT_GID: ${{ vars.ASANA_PROJECT_GID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/asana-mirror.ps1 -Mode reconcile -Repo $env:GITHUB_REPOSITORY
